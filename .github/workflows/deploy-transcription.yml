name: Deploy Transcription Service to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'services/transcription/**'
      - '.github/workflows/deploy-transcription.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Call Reusable Cloud Run Deployment
    uses: dipeshsingh2012/shared-workflows/.github/workflows/deploy-cloud-run.yml@main
    with:
      service_name: 'lecturescribe-transcription'
      port: 8080
      region: 'us-central1'
      project_id: 'lecturescribe-509611'
      gar_repository: 'services'
      dockerfile: 'services/transcription/Dockerfile'
      context: '.'
      health_check_path: '/health'
      memory: '4Gi'
      cpu: '2'
      max_instances: '3'
    secrets:
      EXTRA_ENV_VARS: ${{ secrets.TRANSCRIPTION_EXTRA_ENV_VARS }}
